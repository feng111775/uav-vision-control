car_start_gateway:
  ros__parameters:
    simulation_mode: true
    transport: udp
    real_transport_enabled: true
    udp_host: 127.0.0.1
    udp_port: 19011
    udp_peer_host: 127.0.0.1
    udp_peer_port: 19012
    udp_require_peer: true
    esp32_ip: 127.0.0.1
    ping_period_sec: 1.0
    link_timeout_sec: 2.5
    receive_buffer_size: 512
    allow_state_transition_fallback: true
    communication_only: true
    max_datagram_bytes: 512
    max_packets_per_tick: 16
    running_fallback_count: 3
    running_fallback_max_gap_s: 0.5
    trigger_repeat_count: 3
    trigger_repeat_period_s: 0.1
    subscriber_wait_timeout_s: 2.0
    udp_journal_path: /tmp/uav_control_car_udp_test_journal.json
    start_state_path: /tmp/uav_control_car_start_test_gate.json
