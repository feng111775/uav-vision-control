mission_controller_node:
  ros__parameters:
    # TODO: field-calibrate camera signs, gains and alignment thresholds.
    # This profile is intentionally unable to arm or control a real aircraft.
    mission_mode: drop
    target_altitude: 1.5
    altitude_tolerance: 0.1
    prestream_cycles: 40
    hover_confirm_seconds: 3.0
    hover_test_seconds: 10.0
    dwell_on_car_seconds: 5.0
    mission_timeout_seconds: 90.0
    mission_deadline_s: 90.0
    b_deadline_seconds: 15.0
    # Replace these calibrated progress values before real operation.
    point_b_progress: -1
    point_d_progress: -1
    return_reserve_s: 10.0
    progress_timeout_seconds: 2.0
    point_b_deadline_s: 15.0
    point_b_soft_deadline_s: 13.0
    point_d_deadline_s: 52.0
    payload_latest_command_s: 49.0
    stable_seconds: 1.0
    hover_altitude_m: 1.5
    hover_altitude_tolerance_m: 0.1
    hover_max_vertical_speed_mps: 0.15
    visual_stable_seconds: 0.5
    simulation_mode: false
    competition_mode: true
    enable_control: false
    enable_auto_arm: false
    enable_auto_disarm: false
    enable_visual_follow: true
    enable_payload_release: false
    enable_dynamic_landing: false
    enable_second_takeoff: false
    allow_sitl_heading_quality_bypass: false
    status_timeout: 1.0
    position_timeout: 0.5
    odom_gate_min_frames: 20
    odom_gate_min_source_span_seconds: 1.0
    attitude_timeout: 0.5
    safety_timeout: 1.0
    car_timeout: 2.0
    max_tilt_rad: 0.45
    control_rate_hz: 20.0
    align_error: 0.10
    max_horizontal_speed: 0.5
    high_descent_speed: 0.25
    near_descent_speed: 0.10
    contact_descent_speed: 0.05
    max_descent_speed: 0.4
    dynamic_near_height_m: 0.6
    min_target_altitude: 0.5
    max_target_altitude: 2.0
    command_timeout: 1.0
    command_max_attempts: 3
    payload_ack_timeout: 3.0
    target_loss_abort_seconds: 1.0
    vision_timeout: 0.5
