    vision_source_age_limit_seconds: 0.3
    vision_health_required: true
    status_timeout: 1.0
    position_timeout: 0.5
    odom_gate_min_frames: 20
    odom_gate_min_source_span_seconds: 1.0
    attitude_timeout: 0.5
    safety_timeout: 1.0
    car_timeout: 2.0
    max_tilt_rad: 0.45
