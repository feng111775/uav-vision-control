mission_controller_node:
  ros__parameters:
    # Emergency candidate profile: control remains explicitly disabled until
    # the visual group completes bench and PX4 review.
    mission_mode: drop
    target_altitude: 1.5
    altitude_tolerance: 0.1
    prestream_cycles: 40
    hover_confirm_seconds: 3.0
    hover_test_seconds: 10.0
    dwell_on_car_seconds: 0.0
    mission_timeout_seconds: 90.0
    mission_deadline_s: 90.0
    b_deadline_seconds: 15.0
    point_b_progress: 2
    point_d_progress: 4
    return_reserve_s: 10.0
    progress_timeout_seconds: 2.0
    point_b_deadline_s: 15.0
    point_b_soft_deadline_s: 13.0
    point_d_deadline_s: 52.0
    payload_latest_command_s: 49.0
    stable_seconds: 1.0
    hover_altitude_m: 1.5
    hover_altitude_tolerance_m: 0.1
