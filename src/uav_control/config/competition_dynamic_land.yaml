mission_controller_node:
  ros__parameters:
    # TODO: validate touchdown sensing and descent thresholds without propellers.
    # No focal length or unmeasured touchdown height is assumed here.
    mission_mode: dynamic_land
    target_altitude: 1.5
    car_speed_mps: 0.1
    altitude_tolerance: 0.1
    prestream_seconds: 1.0
    hover_confirm_seconds: 3.0
    touchdown_verify_seconds: 1.0
    hover_test_seconds: 10.0
    dwell_on_car_seconds: 5.0
    mission_timeout_seconds: 90.0
    b_deadline_seconds: 15.0
    stable_seconds: 1.0
    simulation_mode: false
    competition_mode: true
    enable_control: false
    enable_auto_arm: false
    auto_start_hover_test: false
    communication_only: false
    enable_visual_follow: true
    enable_payload_release: false
    vision_adapter_mode: v2_structured
    vision_tracked_topic: /vision/target/tracked
    vision_landing_topic: /vision/landing_error
    vision_health_topic: /vision/health
    vision_receive_timeout_seconds: 0.30
    vision_source_age_limit_seconds: 0.30
    vision_min_confidence: 60.0
    vision_health_required: true
    vision_require_ready_for_closed_loop: true
    vision_swap_xy: false
    vision_invert_x: false
    vision_invert_y: false
    align_stable_duration_sec: 0.4
    enable_dynamic_landing: true
    enable_second_takeoff: true
    status_timeout: 1.0
    position_timeout: 0.5
    attitude_timeout: 0.5
    safety_timeout: 1.0
    car_timeout: 2.0
    max_tilt_rad: 0.45
    control_rate_hz: 20.0
    align_error: 0.10
    descent_speed: 0.25
    near_descent_speed: 0.10
    command_timeout: 1.0
    command_max_attempts: 3
    payload_ack_timeout: 3.0
    target_loss_abort_seconds: 1.0
    guidance_kp_forward: 0.3
    guidance_kp_left: 0.3
    guidance_max_speed: 0.5
    camera_x_sign: -1.0
    camera_y_sign: -1.0
