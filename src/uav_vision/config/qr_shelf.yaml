qr_detector_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/front/image_raw
    detector_backend: hybrid
    model_path: ""
    layout_path: ""
    target_qr_id: 7
    inventory_mode: target
    confidence_threshold: 0.35
    confirm_frames: 3
    qr_timeout: 30.0
    image_timeout: 0.5
    laser_alignment_threshold: 12.0
    laser_confirm_frames: 5
    visualization: true
    detection_topic: /vision/qr/detection
    confirmed_topic: /vision/qr/confirmed
    inventory_topic: /vision/qr/inventory
    target_topic: /vision/front/detection
    laser_topic: /vision/qr/laser_aligned
    diagnostics_topic: /vision/qr/diagnostics
    debug_image_topic: /vision/qr/debug_image
