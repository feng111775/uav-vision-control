pi_camera_vision_node:
  ros__parameters:
    source_type: picamera2
    source: ""
    device: 0
    loop: false
    width: 640
    height: 480
    fps: 15.0
    rotation: 0
    flip_horizontal: false
    flip_vertical: false
    min_area: 100.0
    morphology_kernel: 5
    red1_h_min: 0
    red1_h_max: 10
    red2_h_min: 170
    red2_h_max: 179
    saturation_min: 100
    value_min: 80
    detection_topic: /vision/front/detection
    display: false

h7_bridge_node:
  ros__parameters:
    port: /dev/ttyACM0
    baudrate: 115200
    image_width: 320.0
    image_height: 240.0
    detection_topic: /vision/down/detection

camera_selector_node:
  ros__parameters:
    mode: auto
    front_detection_topic: /vision/front/detection
    down_detection_topic: /vision/down/detection
    selected_detection_topic: /vision/selected_detection
    selected_camera_topic: /vision/selected_camera
    front_confirm_frames: 3
    front_area_ratio_threshold: 0.10
    front_width_ratio_threshold: 0.40
    front_height_ratio_threshold: 0.40
    down_confirm_frames: 3
    down_hold_frames: 2
    down_lost_frames: 5
    source_timeout: 0.4
    switch_cooldown: 2.0
    publish_rate: 20.0

target_filter_node:
  ros__parameters:
    alpha: 0.35
    min_confidence: 50.0
    confirm_frames: 3
    lost_frames: 3
    detection_topic: /vision/selected_detection
    filtered_detection_topic: /vision/selected_filtered_detection

visual_servo_node:
  ros__parameters:
    kp_x: 0.15
    kp_y: 0.15
    deadband_x: 0.05
    deadband_y: 0.05
    max_velocity: 0.15
    stale_timeout: 0.4
    sign_x: -1.0
    sign_y: -1.0
    camera_mode: front
    front_approach_velocity: 0.08
    selected_camera_topic: /vision/selected_camera
    camera_source_timeout: 0.4
    filtered_detection_topic: /vision/selected_filtered_detection
    vision_velocity_topic: /control/vision_velocity

vision_offboard_controller:
  ros__parameters:
    simulation_mode: false
    enable_offboard: false
    enable_auto_arm: false
    target_altitude: 0.8
    altitude_kp: 0.5
    max_xy_speed: 0.25
    max_z_speed: 0.20
    vision_timeout: 0.4
    takeoff_tolerance: 0.10
    takeoff_timeout: 20.0
    px4_status_timeout: 1.0
    local_position_timeout: 0.5
    vision_velocity_topic: /control/vision_velocity
    offboard_control_mode_topic: /fmu/in/offboard_control_mode
    trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
    vehicle_command_topic: /fmu/in/vehicle_command
    vehicle_local_position_topic: /fmu/out/vehicle_local_position_v1
    vehicle_status_topic: /fmu/out/vehicle_status_v1
