front_red_target_detector:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/front/image_raw
    detection_topic: /vision/front/detection
    debug_image_topic: /vision/front/debug_image
    min_area: 100.0
    confidence: 90.0
    morphology_kernel: 5
    red1_h_min: 0
    red1_h_max: 10
    red2_h_min: 170
    red2_h_max: 179
    saturation_min: 100
    value_min: 70
    debug: true

down_red_target_detector:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/down/image_raw
    detection_topic: /vision/down/detection
    debug_image_topic: /vision/down/debug_image
    min_area: 100.0
    confidence: 90.0
    morphology_kernel: 5
    red1_h_min: 0
    red1_h_max: 10
    red2_h_min: 170
    red2_h_max: 179
    saturation_min: 100
    value_min: 70
    debug: true

camera_selector_node:
  ros__parameters:
    use_sim_time: true
    mode: auto
    front_detection_topic: /vision/front/detection
    down_detection_topic: /vision/down/detection
    selected_detection_topic: /vision/selected_detection
    selected_camera_topic: /vision/selected_camera
    front_confirm_frames: 3
    front_area_threshold: 15000.0
    front_size_threshold: 140.0
    down_confirm_frames: 3
    down_hold_frames: 2
    down_lost_frames: 5
    source_timeout: 0.3
    switch_cooldown: 2.0
    publish_rate: 20.0

target_filter_node:
  ros__parameters:
    use_sim_time: true
    alpha: 0.35
    min_confidence: 50.0
    confirm_frames: 3
    lost_frames: 3
    detection_topic: /vision/selected_detection
    filtered_detection_topic: /vision/selected_filtered_detection

visual_servo_node:
  ros__parameters:
    use_sim_time: true
    center_x: 320.0
    center_y: 240.0
    kp_x: 0.002
    kp_y: 0.002
    deadband_x: 10.0
    deadband_y: 10.0
    max_velocity: 0.15
    stale_timeout: 0.3
    sign_x: -1.0
    sign_y: -1.0
    camera_mode: front
    front_approach_velocity: 0.12
    selected_camera_topic: /vision/selected_camera
    camera_source_timeout: 0.3
    filtered_detection_topic: /vision/selected_filtered_detection
    vision_velocity_topic: /control/vision_velocity

vision_offboard_controller:
  ros__parameters:
    use_sim_time: true
    simulation_mode: true
    enable_offboard: false
    enable_auto_arm: false
    target_altitude: 2.0
    altitude_kp: 0.8
    max_vertical_velocity: 0.5
    max_horizontal_velocity: 0.3
    vision_timeout: 0.3
    takeoff_tolerance: 0.15
    takeoff_timeout: 25.0
    px4_status_timeout: 1.5
    local_position_timeout: 0.5
    vision_velocity_topic: /control/vision_velocity
    offboard_control_mode_topic: /fmu/in/offboard_control_mode
    trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
    vehicle_command_topic: /fmu/in/vehicle_command
    vehicle_local_position_topic: /fmu/out/vehicle_local_position_v1
    vehicle_status_topic: /fmu/out/vehicle_status_v1

dual_camera_bridge:
  ros__parameters:
    use_sim_time: true
