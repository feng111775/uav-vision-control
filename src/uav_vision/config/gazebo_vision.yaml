gazebo_red_target_detector_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/down/image_raw
    detection_topic: /vision/h7/detection
    debug_image_topic: /vision/gazebo/debug_image
    min_area: 100.0
    confidence: 90.0
    morphology_kernel: 5
    red1_h_min: 0
    red1_h_max: 10
    red2_h_min: 170
    red2_h_max: 179
    saturation_min: 100
    value_min: 70
    debug: true

target_filter_node:
  ros__parameters:
    use_sim_time: true
    alpha: 0.35
    angle_alpha: 0.35
    min_confidence: 50.0
    confirm_frames: 3
    lost_frames: 3
    detection_topic: /vision/h7/detection
    filtered_detection_topic: /vision/h7/filtered_detection

target_predictor_node:
  ros__parameters:
    use_sim_time: true
    prediction_horizon: 0.08
    max_velocity_px_s: 800.0
    max_jump_px: 80.0
    loss_timeout_sec: 0.3
    input_timeout_sec: 0.3
    filtered_detection_topic: /vision/h7/filtered_detection
    tracked_topic: /vision/target/tracked

landing_error_node:
  ros__parameters:
    use_sim_time: true
    tracked_topic: /vision/target/tracked
    landing_error_topic: /vision/landing_error
    image_center_x: 320.0
    image_center_y: 240.0
    input_timeout_ms: 300.0

visual_servo_node:
  ros__parameters:
    use_sim_time: true
    kp_x: 0.32
    kp_y: 0.24
    image_width: 1280.0
    image_height: 960.0
    deadband_x: 0.0625
    deadband_y: 0.0833333333
    max_velocity: 0.15
    stale_timeout: 0.3
    sign_x: -1.0
    sign_y: -1.0
    filtered_detection_topic: /vision/h7/filtered_detection
    vision_velocity_topic: /control/vision_velocity

vision_dashboard_node:
  ros__parameters:
    use_sim_time: true
    tracked_topic: /vision/target/tracked
    landing_error_topic: /vision/landing_error
    canvas_topic: /vision/debug/target_canvas
    status_topic: /vision/debug/status
    detector_status_topic: /vision/h7/status
    input_timeout_sec: 0.4
    publish_rate_hz: 10.0
    enable_local_window: false

parameter_bridge:
  ros__parameters:
    use_sim_time: true
