gazebo_red_target_detector_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/down/image_raw
    min_area: 100.0
    confidence: 90.0
    morphology_kernel: 5
    red1_h_min: 0
    red1_h_max: 10
    red2_h_min: 170
    red2_h_max: 179
    saturation_min: 100
    value_min: 70
    debug: true

target_filter_node:
  ros__parameters:
    use_sim_time: true
    alpha: 0.35
    min_confidence: 50.0
    confirm_frames: 3
    lost_frames: 3

visual_servo_node:
  ros__parameters:
    use_sim_time: true
    center_x: 160.0
    center_y: 120.0
    kp_x: 0.002
    kp_y: 0.002
    deadband_x: 10.0
    deadband_y: 10.0
    max_velocity: 0.15
    stale_timeout: 0.3
    sign_x: -1.0
    sign_y: -1.0

parameter_bridge:
  ros__parameters:
    use_sim_time: true
