h7_bridge_node:
  ros__parameters:
    port: /dev/dtask_openmv
    baudrate: 115200
    allow_legacy_protocol: false
    detection_topic: /vision/h7/detection
    status_topic: /vision/h7/status
    target_age_topic: /vision/h7/target_age_ms
    data_timeout_sec: 0.30

vision_interface_node:
  ros__parameters:
    # Closed-loop remains opt-in; calibration is explicitly false until the
    # four-direction prop-off check is completed on the target aircraft.
    closed_loop_enable: false
    closed_loop_min_fps: 5.0
    closed_loop_stable_seconds: 2.0
    closed_loop_receive_timeout_seconds: 0.30
    closed_loop_source_age_limit_ms: 300.0
    calibration_profile: ''
    calibration_loaded: false
    replay_only: false

fake_h7_node:
  ros__parameters:
    detection_topic: /vision/h7/detection
    publish_rate_hz: 10.0
    enable_temporary_loss: true
    loss_every_frames: 80
    loss_duration_frames: 2

target_filter_node:
  ros__parameters:
    detection_topic: /vision/h7/detection
    filtered_detection_topic: /vision/h7/filtered_detection
    alpha: 0.35
    angle_alpha: 0.35
    min_confidence: 50.0
    confirm_frames: 3
    lost_frames: 3

target_predictor_node:
  ros__parameters:
    filtered_detection_topic: /vision/h7/filtered_detection
    tracked_topic: /vision/target/tracked
    prediction_horizon: 0.08
    max_velocity_px_s: 800.0
    max_jump_px: 80.0
    loss_timeout_sec: 0.3

landing_error_node:
  ros__parameters:
    tracked_topic: /vision/target/tracked
    landing_error_topic: /vision/landing_error
    image_center_x: 160.0
    image_center_y: 120.0
    input_timeout_ms: 300.0

vision_dashboard_node:
  ros__parameters:
    tracked_topic: /vision/target/tracked
    landing_error_topic: /vision/landing_error
    canvas_topic: /vision/debug/target_canvas
    status_topic: /vision/debug/status
    detector_status_topic: /vision/h7/status
    input_timeout_sec: 0.4
    publish_rate_hz: 10.0
    enable_local_window: false
